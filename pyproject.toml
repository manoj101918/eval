[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "answer-evaluator"
version = "0.1.0"
description = "Grades handwritten college answer scripts with a vision LLM, with teacher review."
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7",
    "azure-ai-documentintelligence>=1.0",
    "aiohttp>=3.9",  # async transport for the Azure SDK
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    # web app (phase 3)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# Phase 5 deployment: background jobs on Redis
queue = [
    "arq>=0.26",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "qrcode>=7.4",
    "ruff>=0.5",
]
# python -m experiments.ocr_compare (OCR engine comparison; not used by the app)
experiments = [
    "easyocr>=1.7",
]

[tool.setuptools.packages.find]
include = ["backend*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # generated migrations
